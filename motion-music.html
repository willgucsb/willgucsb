<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101216">
<title>Motion Music</title>
<style>
  :root {
    --bg: #101216; --panel: #1a1d23; --text: #e8eaed; --muted: #9aa0a6;
    --accent: #4f8cff; --stop: #e5484d; --line: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  h1 { font-size: 22px; margin: 0 0 2px; }
  p.sub { color: var(--muted); margin: 0 0 10px; text-align: center; font-size: 14px; }
  .stage {
    position: relative; width: 100%; max-width: 900px;
    flex: 1 1 auto; min-height: 240px; max-height: 75vh;
    background: #000; border-radius: 12px; overflow: hidden;
    touch-action: manipulation;
  }
  video, canvas.overlay {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  }
  .stage.mirror video, .stage.mirror canvas.overlay { transform: scaleX(-1); }
  .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; padding: 20px;
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: center;
    margin-top: 12px; width: 100%; max-width: 900px;
    background: var(--panel); padding: 12px; border-radius: 12px;
  }
  .buttons { display: flex; gap: 10px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px;
    padding: 12px 22px; min-height: 48px; cursor: pointer; color: #fff;
  }
  #start { background: var(--accent); }
  #stop { background: var(--stop); }
  #flip { background: #3a3f48; }
  button.small { background: #3a3f48; padding: 10px 16px; }
  #mute.off { background: var(--stop); }
  .controls.audio { margin-top: 8px; }
  .astate { color: var(--muted); font-size: 13px; }
  .astate.ok { color: #46c46e; }
  .astate.bad { color: #f0a03c; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); min-height: 44px; }
  input[type=range] { width: 130px; height: 32px; }
  select {
    font: inherit; font-size: 16px; /* 16px stops iOS zooming on focus */
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 40px;
  }
  #status { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 1.2em; text-align: center; }
</style>
</head>
<body>
  <h1>Motion Music</h1>
  <p class="sub">Move in front of the camera. Each part of the picture plays its own note.</p>

  <div class="stage mirror" id="stage">
    <div class="placeholder" id="placeholder">Press&nbsp;<b>Start</b>&nbsp;and allow camera access.</div>
    <video id="video" playsinline muted autoplay></video>
    <canvas class="overlay" id="overlay"></canvas>
  </div>

  <div class="controls">
    <div class="buttons">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <button id="flip" title="Switch between front and back camera">Flip camera</button>
    </div>
    <label>Sensitivity <input id="sens" type="range" min="1" max="100" value="60"></label>
    <label>Grid
      <select id="grid">
        <option value="3x3">3 × 3</option>
        <option value="4x3" selected>4 × 3</option>
        <option value="6x4">6 × 4</option>
      </select>
    </label>
    <label>Sound
      <select id="wave">
        <option value="clarinet" selected>Clarinet</option>
        <option value="sine">Soft</option>
        <option value="triangle">Mellow</option>
        <option value="square">Retro</option>
        <option value="sawtooth">Bright</option>
      </select>
    </label>
  </div>
  <div class="controls audio">
    <button id="mute" class="small">🔊 Sound on</button>
    <label>Volume <input id="vol" type="range" min="0" max="100" value="80"></label>
    <button id="test" class="small">Test sound</button>
    <span id="astate" class="astate">Sound: not started</span>
  </div>
  <div id="status"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), overlay = $('overlay'), stage = $('stage');
  const octx = overlay.getContext('2d');
  const startBtn = $('start'), stopBtn = $('stop'), flipBtn = $('flip');
  const sensEl = $('sens'), gridEl = $('grid'), waveEl = $('wave');
  const statusEl = $('status'), placeholder = $('placeholder');

  // Small offscreen canvas for cheap frame differencing (size follows camera aspect)
  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently: true });
  let W = 160, H = 120;

  // Major pentatonic scale across several octaves, so notes always sound good together
  const PENTA = [0, 2, 4, 7, 9];
  // Clarinet stays in its natural range (D3 up to about D6) by wrapping after three octaves
  const noteFreq = i => {
    const clar = waveEl.value === 'clarinet';
    if (clar) i = i % 15;
    const midi = (clar ? 50 : 48) + PENTA[i % 5] + 12 * Math.floor(i / 5);
    return 440 * Math.pow(2, (midi - 69) / 12);
  };

  let stream = null, audio = null, master = null, rafId = null, wakeLock = null;
  let facing = 'user'; // 'user' = front/selfie camera, 'environment' = back camera
  let prev = null, cols = 4, rows = 3, lastPlayed = [], flash = [];
  const COOLDOWN_MS = 250;

  function parseGrid() {
    [cols, rows] = gridEl.value.split('x').map(Number);
    lastPlayed = new Array(cols * rows).fill(0);
    flash = new Array(cols * rows).fill(0);
  }
  gridEl.addEventListener('change', parseGrid);
  parseGrid();

  function sizeWork() {
    const vw = video.videoWidth || 4, vh = video.videoHeight || 3;
    const scale = 160 / Math.max(vw, vh);
    W = Math.max(40, Math.round(vw * scale)); H = Math.max(40, Math.round(vh * scale));
    work.width = W; work.height = H; prev = null;
  }
  video.addEventListener('loadedmetadata', sizeWork);
  video.addEventListener('resize', sizeWork); // fires when the phone rotates

  // ---------- Audio ----------
  const muteBtn = $('mute'), volEl = $('vol'), testBtn = $('test'), astate = $('astate');
  let muted = false;

  // A tiny silent WAV played through an <audio> element. On iPhone/iPad this moves the
  // page into "media playback" mode, so Web Audio is not silenced by the ring/silent switch.
  const silentEl = (() => {
    const rate = 8000, n = rate / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
    const el = document.createElement('audio');
    el.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    el.loop = true; el.setAttribute('playsinline', '');
    return el;
  })();

  function targetGain() { return muted ? 0 : Math.pow(Number(volEl.value) / 100, 2); }

  // Must be called directly from a tap/click.
  function ensureAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    silentEl.play().catch(() => {});
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      master = audio.createGain();
      const comp = audio.createDynamicsCompressor();
      master.connect(comp).connect(audio.destination);
      audio.onstatechange = updateAudioState;
      // Prime the output with a one-sample silent buffer (older iOS needs this)
      const b = audio.createBufferSource();
      b.buffer = audio.createBuffer(1, 1, 22050);
      b.connect(audio.destination); b.start(0);
    }
    master.gain.value = targetGain();
    if (audio.state !== 'running') audio.resume().then(updateAudioState, updateAudioState);
    updateAudioState();
  }

  function updateAudioState() {
    if (!audio) { astate.textContent = 'Sound: not started'; astate.className = 'astate'; return; }
    const st = audio.state;
    if (st === 'running' && muted) { astate.textContent = 'Sound: muted'; astate.className = 'astate bad'; }
    else if (st === 'running') { astate.textContent = 'Sound: on'; astate.className = 'astate ok'; }
    else if (!stream) { astate.textContent = 'Sound: paused'; astate.className = 'astate'; }
    else { astate.textContent = 'Sound: blocked, tap Test sound'; astate.className = 'astate bad'; }
  }

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound on';
    muteBtn.classList.toggle('off', muted);
    if (audio) master.gain.setTargetAtTime(targetGain(), audio.currentTime, 0.02);
    updateAudioState();
  });
  volEl.addEventListener('input', () => {
    if (audio) master.gain.setTargetAtTime(targetGain(), audio.currentTime, 0.02);
  });
  testBtn.addEventListener('click', () => {
    ensureAudio();
    if (muted) muteBtn.click(); // testing implies you want to hear it
    audio.resume().then(() => [0, 2, 4].forEach((k, i) => setTimeout(() => playNote(noteFreq(5 + k), 1), i * 150)));
  });
  // iPad can pause audio when the app is backgrounded; bring it back on return
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && audio && stream) audio.resume().then(updateAudioState);
  });

  function playNote(freq, strength) {
    if (!audio || audio.state !== 'running') return;
    if (waveEl.value === 'clarinet') return playClarinet(freq, strength);
    const t = audio.currentTime;
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = waveEl.value;
    osc.frequency.value = freq;
    const peak = 0.15 + 0.25 * Math.min(1, strength);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
    osc.connect(gain).connect(master);
    osc.start(t); osc.stop(t + 0.85);
  }

  // ---------- Clarinet ----------
  // A clarinet's tone is mostly odd harmonics (1st, 3rd, 5th...), giving its hollow, woody
  // sound. We build that waveform once, soften it with a filter that opens as the note is
  // "blown", add a puff of breath noise at the start and a gentle vibrato.
  let clarWave = null, breathBuf = null;
  function clarinetParts() {
    if (clarWave) return;
    const amps = [0, 1, 0.05, 0.75, 0.04, 0.5, 0.03, 0.33, 0.02, 0.2, 0.015, 0.12, 0.01, 0.07, 0.005, 0.04];
    const real = new Float32Array(amps.length), imag = new Float32Array(amps);
    clarWave = audio.createPeriodicWave(real, imag);
    breathBuf = audio.createBuffer(1, audio.sampleRate * 0.5, audio.sampleRate);
    const d = breathBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function playClarinet(freq, strength) {
    clarinetParts();
    const t = audio.currentTime, dur = 0.9;
    const loud = 0.12 + 0.18 * Math.min(1, strength);

    const osc = audio.createOscillator();
    osc.setPeriodicWave(clarWave);
    osc.frequency.value = freq;

    // Vibrato that fades in after the attack
    const lfo = audio.createOscillator(), lfoGain = audio.createGain();
    lfo.frequency.value = 5;
    lfoGain.gain.setValueAtTime(0, t);
    lfoGain.gain.linearRampToValueAtTime(freq * 0.004, t + 0.35);
    lfo.connect(lfoGain).connect(osc.frequency);

    // Tone gets brighter as the reed starts vibrating, then mellows
    const filt = audio.createBiquadFilter();
    filt.type = 'lowpass'; filt.Q.value = 0.8;
    const bright = Math.min(6000, freq * (6 + 6 * strength));
    filt.frequency.setValueAtTime(freq * 2, t);
    filt.frequency.exponentialRampToValueAtTime(bright, t + 0.06);
    filt.frequency.exponentialRampToValueAtTime(Math.max(freq * 3, bright * 0.6), t + dur);

    // Breath-like envelope: soft swell, sustain, smooth release
    const env = audio.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(loud, t + 0.05);
    env.gain.setValueAtTime(loud, t + 0.05);
    env.gain.linearRampToValueAtTime(loud * 0.8, t + dur - 0.25);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(filt).connect(env).connect(master);

    // Short puff of air at the start of the note
    const noise = audio.createBufferSource(); noise.buffer = breathBuf;
    const nf = audio.createBiquadFilter(); nf.type = 'bandpass';
    nf.frequency.value = Math.min(5000, freq * 4); nf.Q.value = 1.2;
    const ng = audio.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(loud * 0.25, t + 0.02);
    ng.gain.exponentialRampToValueAtTime(loud * 0.03, t + 0.12);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    noise.connect(nf).connect(ng).connect(master);

    osc.start(t); lfo.start(t); noise.start(t);
    osc.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05); noise.stop(t + dur + 0.05);
  }

  function loop() {
    rafId = requestAnimationFrame(loop);
    if (video.readyState < 2 || !video.videoWidth) return;

    wctx.drawImage(video, 0, 0, W, H);
    const cur = wctx.getImageData(0, 0, W, H).data;

    const s = Number(sensEl.value) / 100;
    const pixThresh = 70 - 50 * s;     // per-pixel change needed
    const zoneFrac = 0.12 - 0.11 * s;  // share of a zone that must change

    const n = cols * rows, counts = new Array(n).fill(0);
    const zw = W / cols, zh = H / rows;
    if (prev && prev.length === cur.length) {
      for (let y = 0; y < H; y += 2) {
        const zy = Math.min(rows - 1, Math.floor(y / zh));
        for (let x = 0; x < W; x += 2) {
          const i = (y * W + x) * 4;
          const d = Math.abs(cur[i] - prev[i]) + Math.abs(cur[i+1] - prev[i+1]) + Math.abs(cur[i+2] - prev[i+2]);
          if (d / 3 > pixThresh) counts[zy * cols + Math.min(cols - 1, Math.floor(x / zw))]++;
        }
      }
    }
    prev = cur;

    const now = performance.now(), pixelsPerZone = (zw * zh) / 4;
    const mirrored = facing === 'user';
    for (let z = 0; z < n; z++) {
      const frac = counts[z] / pixelsPerZone;
      if (frac > zoneFrac && now - lastPlayed[z] > COOLDOWN_MS) {
        lastPlayed[z] = now; flash[z] = 1;
        // Higher notes toward the top, rising left-to-right as you see it on screen
        const row = rows - 1 - Math.floor(z / cols);
        const col = mirrored ? cols - 1 - (z % cols) : z % cols;
        playNote(noteFreq(row * cols + col), frac / (zoneFrac * 4));
      }
    }
    draw();
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const cw = overlay.clientWidth, ch = overlay.clientHeight;
    if (overlay.width !== Math.round(cw * dpr) || overlay.height !== Math.round(ch * dpr)) {
      overlay.width = Math.round(cw * dpr); overlay.height = Math.round(ch * dpr);
    }
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.clearRect(0, 0, cw, ch);
    // Where the video actually sits inside the stage (object-fit: contain)
    const va = video.videoWidth / video.videoHeight, sa = cw / ch;
    const vw = va > sa ? cw : ch * va, vh = va > sa ? cw / va : ch;
    const ox = (cw - vw) / 2, oy = (ch - vh) / 2;
    const zw = vw / cols, zh = vh / rows;
    for (let z = 0; z < cols * rows; z++) {
      const x = ox + (z % cols) * zw, y = oy + Math.floor(z / cols) * zh;
      if (flash[z] > 0.02) {
        octx.fillStyle = `hsla(${(z * 360 / (cols * rows)) | 0}, 90%, 60%, ${0.45 * flash[z]})`;
        octx.fillRect(x, y, zw, zh);
        flash[z] *= 0.88;
      }
      octx.strokeStyle = 'rgba(255,255,255,0.25)';
      octx.lineWidth = 1;
      octx.strokeRect(x + 0.5, y + 0.5, zw - 1, zh - 1);
    }
  }

  async function openCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    stage.classList.toggle('mirror', facing === 'user');
    sizeWork();
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  async function start() {
    startBtn.disabled = true;
    // Start audio right inside the tap, before any await (needed on iPhone/iPad)
    ensureAudio();
    statusEl.textContent = 'Requesting camera…';
    try {
      await openCamera();
    } catch (err) {
      statusEl.textContent = 'Could not access the camera: ' + (err.message || err.name);
      startBtn.disabled = false;
      return;
    }
    if (audio.state !== 'running') audio.resume().then(updateAudioState, updateAudioState);
    placeholder.style.display = 'none';
    stopBtn.disabled = false;
    statusEl.textContent = 'Listening for movement…';
    keepAwake();
    cancelAnimationFrame(rafId);
    loop();
  }

  function stop() {
    cancelAnimationFrame(rafId); rafId = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; video.srcObject = null;
    silentEl.pause();
    if (audio) audio.suspend().then(updateAudioState);
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    prev = null;
    octx.clearRect(0, 0, overlay.width, overlay.height);
    placeholder.style.display = 'flex';
    stopBtn.disabled = true; startBtn.disabled = false;
    statusEl.textContent = 'Stopped. Camera is off.';
  }

  async function flip() {
    facing = facing === 'user' ? 'environment' : 'user';
    flipBtn.textContent = facing === 'user' ? 'Flip camera' : 'Flip camera (back)';
    if (!stream) return; // will use the new camera on next Start
    try { await openCamera(); }
    catch (err) { statusEl.textContent = 'Could not switch camera: ' + (err.message || err.name); }
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  flipBtn.addEventListener('click', flip);
  // Re-acquire the wake lock when coming back to the tab
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && stream) keepAwake();
  });

  if (!window.isSecureContext) {
    statusEl.textContent = 'Camera needs a secure (https://) page on phones and tablets.';
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    startBtn.disabled = true;
    statusEl.textContent = 'Camera is not available here. On a phone or iPad, open this page from an https:// link.';
  }
})();
</script>
</body>
</html>
